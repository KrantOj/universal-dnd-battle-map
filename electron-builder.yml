appId: com.krantoj.udbm
productName: Universal DnD Battle map
directories:
  output: dist
files:
  - src/**
  - package.json
  - tests/fixtures/**
  - build/icon.png
  - LICENSE
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  include: build/installer.nsh
  artifactName: "Universal-DnD-Battle-map-Setup-${version}.exe"
portable:
  artifactName: "Universal-DnD-Battle-map-${version}-portable.exe"
publish:
  provider: github
  owner: KrantOj
  repo: universal-dnd-battle-map
