appId: com.krantoj.udbm
productName: Universal DnD Battle map
directories:
  output: dist
files:
  - src/**
  - package.json
  - tests/fixtures/**
  - build/icon.png
  - LICENSE
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
mac:
  icon: build/icon.png
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: "-"            # ad-hoc подпись (без Apple Developer ID): Apple Silicon не запускает совсем неподписанное
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: "Universal-DnD-Battle-map-${version}-mac-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  include: build/installer.nsh
  artifactName: "Universal-DnD-Battle-map-Setup-${version}.exe"
portable:
  artifactName: "Universal-DnD-Battle-map-${version}-portable.exe"
publish:
  provider: github
  owner: KrantOj
  repo: universal-dnd-battle-map
