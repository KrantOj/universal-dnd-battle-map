name: Mac build

# Собирает .dmg (arm64 + x64, ad-hoc подпись, без нотаризации) и прикладывает к релизу.
# Запускается при публикации релиза (npm run release -- --publish) или вручную: Actions -> Mac build -> Run workflow (tag = vX.Y.Z).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, к которому приложить .dmg (например v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Прикладываем .dmg к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.dmg --clobber
