name: Mac build

# Собирает .dmg (arm64 + x64, ad-hoc подпись, без нотаризации).
#  - при публикации релиза: прикладывает .dmg к этому релизу;
#  - вручную (Actions -> Mac build -> Run workflow): собирает текущий main и сохраняет .dmg как артефакт запуска (релиз не нужен);
#    если указать tag существующего релиза — дополнительно приложит .dmg к нему.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Необязательно: тег существующего релиза (vX.Y.Z), к которому приложить .dmg"
        required: false

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: udbm-mac-dmg
          path: dist/*.dmg
          retention-days: 3
      - name: Прикладываем .dmg к релизу
        if: github.event.release.tag_name || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.dmg --clobber
